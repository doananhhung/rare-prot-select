[project]
name = "rareprotselect"
version = "0.1.0"
description = "Representative Protein Selection with Rare-Aware Submodular Optimization"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "RareProtSelect Team" }
]
dependencies = [
    "torch==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
    "transformers>=4.30.0",
    "fair-esm>=2.0.0",
    "biopython>=1.80",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "tabulate>=0.9.0"
]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

