# Configuration for Pilot Experiment: Thioesterases (27 ThYme Families)
dataset_name: "Thioesterases"
fasta_path: "../baseline_repo/Thioesterases_Sequences.fasta"
benchmark_gold_path: null
model_name: "facebook/esm2_t12_35M_UR50D"
device: "auto"
batch_size: 16
budget_k_list: [5, 10, 15, 20, 27, 30, 50]
weighting_scheme: "inverse_sqrt"
weighting_alpha: 0.5
rare_threshold: 5
min_seq_len: 30
max_seq_len: 2000
max_ambiguous_ratio: 0.05
output_dir: "outputs"
cache_dir: "outputs/embeddings_cache"
seed: 42
